[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-verifier"
version = "0.1.0"
description = "Evidence-linked reference matching across Crossref, OpenAlex, and PubMed"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "python-docx>=1.1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
reference-verifier = "reference_verifier.cli:main"

[tool.setuptools.packages.find]
include = ["reference_verifier*"]

[tool.setuptools.package-data]
reference_verifier = ["web/*", "demo_records.json"]

[tool.pytest.ini_options]
testpaths = ["tests_v2"]
